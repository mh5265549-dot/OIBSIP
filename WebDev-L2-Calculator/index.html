<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Hashir — Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <!-- Display Screen -->
        <div class="display">
            <div id="previousOperand" class="previous-operand"></div>
            <div id="currentOperand" class="current-operand">0</div>
        </div>

        <!-- Button Grid -->
        <div class="buttons-grid">
            <button class="btn span-two action-btn" data-action="clear">C</button>
            <button class="btn action-btn" data-action="delete">DEL</button>
            <button class="btn operator-btn" data-operator="÷">÷</button>
            
            <button class="btn number-btn" data-number="7">7</button>
            <button class="btn number-btn" data-number="8">8</button>
            <button class="btn number-btn" data-number="9">9</button>
            <button class="btn operator-btn" data-operator="×">×</button>
            
            <button class="btn number-btn" data-number="4">4</button>
            <button class="btn number-btn" data-number="5">5</button>
            <button class="btn number-btn" data-number="6">6</button>
            <button class="btn operator-btn" data-operator="-">-</button>
            
            <button class="btn number-btn" data-number="1">1</button>
            <button class="btn number-btn" data-number="2">2</button>
            <button class="btn number-btn" data-number="3">3</button>
            <button class="btn operator-btn" data-operator="+">+</button>
            
            <button class="btn number-btn" data-number="0">0</button>
            <button class="btn number-btn" data-number=".">.</button>
            <button class="btn span-two equals-btn" data-action="equals">=</button>
        </div>
    </div>

    <!-- Automated Watermark Banner for Video Recording -->
    <div class="watermark-banner">
        <span class="banner-name">MUHAMMAD HASHIR</span>
        <span class="banner-task">Web Development & Designing</span>
        <span class="banner-sub">LEVEL 2 · TASK 1 — CALCULATOR</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
