<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <me ta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Hashir — Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-container">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert seamlessly between Celsius, Fahrenheit, and Kelvin.</p>

        <div class="input-group">
            <label for="tempInput">Temperature Value:</label>
            <input type="text" id="tempInput" placeholder="Enter number (e.g. 25)">
        </div>

        <div class="input-group">
            <label for="unitSelect">Input Unit:</label>
            <select id="unitSelect">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>
        </div>

        <button id="convertBtn">Convert Temperature</button>

        <div id="errorMsg" class="error-msg hidden"></div>

        <div id="resultsArea" class="results-area hidden">
            <h3>Converted Results:</h3>
            <div class="result-card">
                <span id="celsiusResult">-</span>
            </div>
            <div class="result-card">
                <span id="fahrenheitResult">-</span>
            </div>
            <div class="result-card">
                <span id="kelvinResult">-</span>
            </div>
        </div>
    </div>

    <!-- Automated Banner requested for video and submission tracking -->
    <div class="watermark-banner">
        <span class="banner-name">MUHAMMAD HASHIR</span>
        <span class="banner-task">Web Development & Designing</span>
        <span class="banner-sub">TASK 3 — TEMPERATURE CONVERTER</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
