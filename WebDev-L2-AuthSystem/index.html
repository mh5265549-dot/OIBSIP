<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Hashir — Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <h1>Create Account</h1>
        <p class="subtitle">Register to get started.</p>

        <div class="input-group">
            <label for="regEmail">Email / Username:</label>
            <input type="text" id="regEmail" placeholder="Enter your email or username">
        </div>

        <div class="input-group">
            <label for="regPassword">Password:</label>
            <input type="password" id="regPassword" placeholder="Min 8 chars, at least 1 number">
        </div>

        <button id="registerBtn">Register</button>

        <div id="errorMsg" class="error-msg hidden"></div>
        <div id="successMsg" class="success-msg hidden"></div>

        <p class="switch-auth">
            Already have an account? <a href="login.html">Login here</a>
        </p>
    </div>

    <!-- Automated Watermark Banner for Video Recording -->
    <div class="watermark-banner">
        <span class="banner-name">MUHAMMAD HASHIR</span>
        <span class="banner-task">Web Development & Designing</span>
        <span class="banner-sub">LEVEL 2 · TASK 4 — AUTH SYSTEM</span>
    </div>

    <script src="auth.js"></script>
</body>
</html>
