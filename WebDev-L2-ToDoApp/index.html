<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Hashir — To-Do Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h1>To-Do List Manager</h1>
        <p class="subtitle">Organize your daily tasks efficiently.</p>

        <!-- Task Input Form -->
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>

        <!-- Task Lists Wrapper -->
        <div class="lists-wrapper">
            <!-- Pending Tasks -->
            <div class="task-column">
                <div class="column-header">
                    <h2>Pending Tasks</h2>
                    <span id="pendingCount" class="badge">0 pending</span>
                </div>
                <ul id="pendingList" class="task-list">
                    <!-- Populated via JavaScript -->
                </ul>
                <div id="pendingEmpty" class="empty-msg">No pending tasks. Take a break!</div>
            </div>

            <!-- Completed Tasks -->
            <div class="task-column">
                <div class="column-header">
                    <h2>Completed Tasks</h2>
                    <span id="completedCount" class="badge completed-badge">0 completed</span>
                </div>
                <ul id="completedList" class="task-list">
                    <!-- Populated via JavaScript -->
                </ul>
                <div id="completedEmpty" class="empty-msg">No completed tasks yet.</div>
            </div>
        </div>
    </div>

    <!-- Automated Watermark Banner for Video Recording -->
    <div class="watermark-banner">
        <span class="banner-name">MUHAMMAD HASHIR</span>
        <span class="banner-task">Web Development & Designing</span>
        <span class="banner-sub">LEVEL 2 · TASK 2 — TO-DO APP</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
